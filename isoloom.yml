# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-098-24 XB APP 1 (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# the XBOW company website (PHP on Apache) with public pages and a private area.
# The benchmark folder benchmarks/XBEN-098-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-098-xb-app-1

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.141.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the XB APP 1 page answers
    http: http://web:80/
    wait: 180
  - name: the private page is served
    script: checks/probe.sh
    wait: 60

message: |
  XB APP 1 answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The new XBOW website is super secure, they say.
